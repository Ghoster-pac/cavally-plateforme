<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CAVALLY — hors connexion</title>
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      background:#0b6b6f;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center}
    .box{max-width:420px;padding:28px}
    .logo{display:inline-block;background:#fff;color:#0b6b6f;font-weight:800;letter-spacing:.5px;
      border-radius:12px;padding:8px 16px;font-size:24px;margin-bottom:18px}
    p{opacity:.92;line-height:1.55;font-size:15px}
    button{margin-top:18px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.5);
      color:#fff;padding:11px 20px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}
    button:hover{background:rgba(255,255,255,.26)}
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">CAVALLY</div>
    <h2>Pas de connexion</h2>
    <p>La plateforme n'a pas pu être jointe. Vérifiez votre connexion internet, puis réessayez.</p>
    <p>Vos saisies déjà effectuées hors-ligne seront synchronisées automatiquement dès le retour du réseau.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
