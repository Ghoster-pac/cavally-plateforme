<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b6b6f">
  <title>CAVALLY</title>
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      background:#0b6b6f;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center}
    .box{max-width:320px;padding:24px}
    .logo{display:inline-block;background:#fff;color:#0b6b6f;font-weight:800;letter-spacing:.5px;
      border-radius:12px;padding:8px 14px;font-size:22px;margin-bottom:16px}
    p{opacity:.9;line-height:1.5;font-size:14px}
    a.btn{display:inline-block;margin-top:14px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.5);
      color:#fff;text-decoration:none;padding:10px 18px;border-radius:10px;font-weight:700}
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">CAVALLY</div>
    <p>Suivi des travaux — projet CAVALLY.</p>
    <p id="msg">Chargement de la plateforme…</p>
    <a class="btn" id="link" href="https://GhosterPacman.pythonanywhere.com">Ouvrir la plateforme</a>
  </div>
  <script>
    // Page de secours affichée uniquement si l'application n'a pas pu charger la
    // plateforme distante (aucun réseau au premier lancement par exemple).
    var URL = "https://GhosterPacman.pythonanywhere.com";
    document.getElementById("link").setAttribute("href", URL);
    setTimeout(function () {
      document.getElementById("msg").textContent =
        "Hors connexion. Reconnectez-vous puis rouvrez l'application.";
    }, 4000);
  </script>
</body>
</html>
